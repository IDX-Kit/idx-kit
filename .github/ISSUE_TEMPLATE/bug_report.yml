name: Bug report
description: Report a problem with IDX Kit.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: >-
        Do not post passwords, API keys, MLS credentials, or real client or
        lead information. Report vulnerabilities privately using the
        repository's security policy, never in a public issue.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the problem without private information.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the steps using synthetic data only.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Which version or commit shows the problem?
    validations:
      required: true
