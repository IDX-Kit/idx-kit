name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    env:
      DATABASE_URL: postgresql://idx_migration:synthetic_ci_db_password@127.0.0.1:55432/idx_demo
      IDX_TEST_LOG_DIR: /tmp/idx-test-logs
      WRANGLER_SEND_METRICS: "false"
      CLOUDFLARE_LOAD_DEV_VARS_FROM_DOT_ENV: "false"
      RUNTIME_DATABASE_URL: postgresql://idx_runtime:synthetic_ci_db_password@127.0.0.1:55432/idx_demo
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install locked dependencies
        run: |
          node --version
          npm ci
      - name: Check formatting and lint
        run: |
          npm run format:check
          npm run lint
      - name: Check Worker exposure and binding invariants
        run: npm run workers:check
      - name: Lint contract with no errors or warnings
        run: npm run contract:lint
      - name: Generate client and compatibility types
        run: |
          npm run contract:generate
          npm run contract:compat
          npm run workers:contract
      - name: Save generated client for inspection
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: generated-client
          path: packages/client/src/generated.ts
      - name: Check generated output is committed and unchanged
        run: |
          git ls-files --error-unmatch packages/client/src/generated.ts
          git diff --exit-code -- packages/client/src/generated.ts
      - name: Typecheck both generated outputs and consumers
        run: npm run typecheck
      - name: Install PostgreSQL 18
        run: |
          # Use only the disposable cluster; package installation must not create one.
          echo 'create_main_cluster = false' | sudo tee -a /etc/postgresql-common/createcluster.conf
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y --no-install-recommends postgresql-18
      - name: Create disposable PostgreSQL 18 cluster
        run: |
          export PATH="/usr/lib/postgresql/18/bin:$PATH"
          postgres --version
          postgres --version | grep -E '^postgres \(PostgreSQL\) 18\.'
          initdb -D "$RUNNER_TEMP/idx11-pg" --auth=trust --username=postgres --locale=C --encoding=UTF8
          pg_ctl -D "$RUNNER_TEMP/idx11-pg" -l "$RUNNER_TEMP/idx11-pg.log" -o "-h 127.0.0.1 -p 55432 -k $RUNNER_TEMP" -w start
          psql -h 127.0.0.1 -p 55432 -U postgres -d postgres -v ON_ERROR_STOP=1 -c 'SELECT version()'
          server_version_num=$(psql -h 127.0.0.1 -p 55432 -U postgres -d postgres -v ON_ERROR_STOP=1 -Atc 'SHOW server_version_num')
          echo "server_version_num=$server_version_num"
          [[ "$server_version_num" =~ ^[0-9]{6}$ ]]
          (( server_version_num >= 180000 && server_version_num <= 189999 ))
          psql -h 127.0.0.1 -p 55432 -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE idx_migration LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE;
          CREATE ROLE idx_runtime LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE;
          CREATE DATABASE idx_demo OWNER idx_migration;
          SQL
          psql -h 127.0.0.1 -p 55432 -U postgres -d idx_demo -v ON_ERROR_STOP=1 -c 'REVOKE CREATE ON SCHEMA public FROM PUBLIC'
      - name: Prove database acceptance and command entry points
        id: acceptance
        run: |
          mkdir -p "$IDX_TEST_LOG_DIR"
          npm test 2>&1 | tee "$IDX_TEST_LOG_DIR/unit.log"
          npm run demo:db:migrate
          npm run demo:seed
      - name: Build server-rendered demo and install its pinned browser
        run: |
          npm run demo:site:build
          npx playwright install --with-deps chromium
      - name: Prove guide, search, paging and property HTML without JavaScript
        run: npm run test:demo 2>&1 | tee "$IDX_TEST_LOG_DIR/demo.log"
      - name: Prove search, live paging, detail and key lifecycle against the contract
        run: npm run test:api 2>&1 | tee "$IDX_TEST_LOG_DIR/api.log"
      - name: Prove detail then search on the same database without reseeding
        run: |
          started=$SECONDS
          node --test tests/api/detail.test.ts 2>&1 | tee "$IDX_TEST_LOG_DIR/api-reverse-detail.log"
          node --test tests/api/search.test.ts 2>&1 | tee "$IDX_TEST_LOG_DIR/api-reverse-search.log"
          elapsed=$((SECONDS - started))
          echo "Reverse-order API proof added ${elapsed}s (budget: 60s)"
          (( elapsed < 60 ))
      - name: Build both Workers without deploying and enforce Free bundle size
        run: |
          npm run workers:site:build
          node scripts/check-worker-config.mjs examples/demo-site/dist-worker/server/wrangler.json
          npx wrangler deploy --config packages/engine/wrangler.jsonc --dry-run --outdir "$RUNNER_TEMP/worker-engine"
          npx wrangler deploy --config examples/demo-site/dist-worker/server/wrangler.json --dry-run --outdir "$RUNNER_TEMP/worker-site"
          node scripts/check-worker-size.mjs "$RUNNER_TEMP/worker-engine" "$RUNNER_TEMP/worker-site"
      - name: Run the API, key lifecycle and contract suites against the engine Worker
        env:
          IDX_RUNTIME: worker
        run: npm run test:api 2>&1 | tee "$IDX_TEST_LOG_DIR/worker-api.log"
      - name: Run the same no-JS site journeys through the Worker service binding
        env:
          IDX_RUNTIME: worker
        run: npm run test:demo 2>&1 | tee "$IDX_TEST_LOG_DIR/worker-demo.log"
      - name: Prove Hyperdrive uses the restricted role and records failure causes
        env:
          IDX_RUNTIME: worker
        run: node --test tests/workers/database.test.ts 2>&1 | tee "$IDX_TEST_LOG_DIR/worker-database.log"
      - name: Prove safe database failure with the cluster stopped by CI
        run: |
          /usr/lib/postgresql/18/bin/pg_ctl -D "$RUNNER_TEMP/idx11-pg" -m fast -w stop
          node --input-type=module <<'JS'
          import assert from "node:assert/strict";
          import { startEngine } from "./tests/api/runtime.ts";
          import { validateResponse } from "./tests/api/contract.ts";
          const engine = await startEngine();
          let body;
          try {
            const response = await fetch("http://127.0.0.1:8787/api/v1/listings/lst_demo_0001", {
              headers: { Authorization: "Bearer invalid-secret-marker" },
            });
            const text = await response.text();
            body = JSON.parse(text);
            assert.equal(response.status, 503);
            assert.equal(body.code, "service_unavailable");
            assert.equal(body.requestId, response.headers.get("Request-Id"));
            validateResponse("/api/v1/listings/{listingId}", response, body);
            for (const value of ["postgres", "SELECT", "secret_hash", "ECONNREFUSED", "127.0.0.1", "idx_runtime"])
              assert.ok(!text.includes(value));
            for (const path of ["/api", "/api/v1/openapi.json"]) {
              const discovery = await fetch(`http://127.0.0.1:8787${path}`);
              assert.equal(discovery.status, 200);
              validateResponse(path, discovery, await discovery.json());
            }
          } finally {
            await engine.stop();
          }
          const failure = engine.logs().trim().split("\n")
            .map((line) => JSON.parse(line))
            .filter((line) => line.requestId === body.requestId);
          assert.equal(failure.length, 1);
          assert.equal(failure[0].operation, "key.lookup");
          assert.equal(failure[0].errorCode, "ECONNREFUSED");
          assert.equal(typeof failure[0].errorType, "string");
          console.log("Stopped database: safe 503, correlated cause, discovery and contract PASS.");
          JS
      - name: Reject credentials in every captured engine and site log
        id: logcheck
        if: always() && steps.acceptance.outcome != 'skipped'
        run: node scripts/check-logs.mjs
      - name: Save verified runtime logs
        if: always() && steps.logcheck.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: runtime-logs
          path: /tmp/idx-test-logs/*.log
      - name: Stop only the task cluster
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/idx11-pg/postmaster.pid" ]; then
            /usr/lib/postgresql/18/bin/pg_ctl -D "$RUNNER_TEMP/idx11-pg" -m fast -w stop
          fi
