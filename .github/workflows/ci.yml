name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  clean-demo:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Follow the clean demo quick start
        shell: bash
        run: |
          awk '/^```bash ci$/{copy=1; next} /^```$/{copy=0} copy' docs/demo-setup.md |
            bash -euo pipefail |
            tee "$RUNNER_TEMP/clean-demo.log"
          grep -Eq '^Checked [0-9]+ captured logs for credentials\.$' "$RUNNER_TEMP/clean-demo.log"
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      client_tag: ${{ steps.client-package.outputs.tag }}
      client_artifact: ${{ steps.client-release-artifact.outputs.artifact-id }}
    defaults:
      run:
        shell: bash
    env:
      IDX_TEST_LOG_DIR: /tmp/idx-test-logs
      WRANGLER_SEND_METRICS: "false"
      CLOUDFLARE_LOAD_DEV_VARS_FROM_DOT_ENV: "false"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Generate and mask disposable database credentials
        run: |
          node --input-type=module <<'JS'
          import { randomBytes } from "node:crypto";
          import { appendFileSync } from "node:fs";
          appendFileSync(process.env.GITHUB_ENV, `IDX_TEST_PG_DIR=${process.env.RUNNER_TEMP}/idx11-pg\n`);
          const password = randomBytes(32).toString("base64url");
          console.log(`::add-mask::${password}`);
          for (const [name, role] of [["DATABASE_URL", "idx_migration"], ["RUNTIME_DATABASE_URL", "idx_runtime"], ["LISTING_WRITER_DATABASE_URL", "idx_listing_writer"]]) {
            const value = `postgresql://${role}:${password}@127.0.0.1:55432/idx_demo`;
            console.log(`::add-mask::${value}`);
            appendFileSync(process.env.GITHUB_ENV, `${name}=${value}\n`);
          }
          JS
      - name: Install locked dependencies
        run: |
          node --version
          npm ci
      - name: Check formatting and lint
        id: style
        run: |
          npm run format:check
          npm run lint
      - name: Prepare a formatting patch on the runner
        if: failure() && steps.style.outcome == 'failure'
        run: |
          npm run format
          git diff --binary > /tmp/formatting.patch
      - name: Save formatting patch
        if: failure() && steps.style.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: formatting-patch
          path: /tmp/formatting.patch
      - name: Audit dependencies including development tooling
        run: npm audit --omit=optional
      - name: Compare lint findings with the pre-update dependency tree
        run: |
          baseline="$RUNNER_TEMP/lint-baseline"
          mkdir -p "$baseline"
          git archive 931c9bee6e0a43c326461adff157a9f0003166ab | tar -x -C "$baseline"
          npm ci --ignore-scripts --no-audit --prefix "$baseline"
          export IDX_BASELINE_ESLINT="$baseline/node_modules/eslint/bin/eslint.js"
          export IDX_BASELINE_CONFIG="$baseline/eslint.config.mjs"
          node "$IDX_BASELINE_ESLINT" --config "$IDX_BASELINE_CONFIG" . --format json > "$RUNNER_TEMP/lint-before.json"
          node node_modules/eslint/bin/eslint.js . --format json > "$RUNNER_TEMP/lint-after.json"
          diff -u "$RUNNER_TEMP/lint-before.json" "$RUNNER_TEMP/lint-after.json"
          node --test tests/code-style.test.ts
      - name: Check Worker exposure and binding invariants
        run: npm run workers:check
      - name: Lint contract with no errors or warnings
        run: npm run contract:lint
      - name: Generate client and compatibility types
        run: |
          npm run contract:generate
          npm run contract:compat
          npm run workers:contract
      - name: Save generated client for inspection
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: generated-client
          path: packages/client/src/generated.ts
      - name: Check generated output is committed and unchanged
        run: |
          git ls-files --error-unmatch packages/client/src/generated.ts
          git diff --exit-code -- packages/client/src/generated.ts
      - name: Typecheck both generated outputs and consumers
        run: npm run typecheck
      - name: Install PostgreSQL 18
        run: |
          # Use only the disposable cluster; package installation must not create one.
          echo 'create_main_cluster = false' | sudo tee -a /etc/postgresql-common/createcluster.conf
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y --no-install-recommends postgresql-18
      - name: Create disposable PostgreSQL 18 cluster
        run: |
          export PATH="/usr/lib/postgresql/18/bin:$PATH"
          postgres --version
          postgres --version | grep -E '^postgres \(PostgreSQL\) 18\.'
          initdb -D "$RUNNER_TEMP/idx11-pg" --auth=trust --username=postgres --locale=C --encoding=UTF8 \
            --locale-provider=builtin --builtin-locale=PG_UNICODE_FAST
          pg_ctl -D "$RUNNER_TEMP/idx11-pg" -l "$RUNNER_TEMP/idx11-pg.log" -o "-h 127.0.0.1 -p 55432 -k $RUNNER_TEMP" -w start
          psql -h 127.0.0.1 -p 55432 -U postgres -d postgres -v ON_ERROR_STOP=1 -c 'SELECT version()'
          server_version_num=$(psql -h 127.0.0.1 -p 55432 -U postgres -d postgres -v ON_ERROR_STOP=1 -Atc 'SHOW server_version_num')
          echo "server_version_num=$server_version_num"
          [[ "$server_version_num" =~ ^[0-9]{6}$ ]]
          (( server_version_num >= 180000 && server_version_num <= 189999 ))
          psql -h 127.0.0.1 -p 55432 -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE idx_migration LOGIN NOSUPERUSER NOCREATEDB CREATEROLE;
          CREATE ROLE idx_listing_writer LOGIN NOINHERIT;
          CREATE DATABASE idx_demo OWNER idx_migration;
          CREATE DATABASE idx_online OWNER idx_migration;
          SQL
          psql -h 127.0.0.1 -p 55432 -U postgres -d idx_demo -v ON_ERROR_STOP=1 -c 'REVOKE CREATE ON SCHEMA public FROM PUBLIC'
      - name: Require password authentication for the online proof
        run: |
          sed -i '1i host idx_online idx_runtime 127.0.0.1/32 scram-sha-256' "$RUNNER_TEMP/idx11-pg/pg_hba.conf"
          /usr/lib/postgresql/18/bin/pg_ctl -D "$RUNNER_TEMP/idx11-pg" reload
          psql -h 127.0.0.1 -p 55432 -U postgres -d idx_online -v ON_ERROR_STOP=1 -c 'REVOKE CREATE ON SCHEMA public FROM PUBLIC'
      - name: Prove online preparation, password login and idempotent key registration
        id: online
        run: |
          mkdir -p "$IDX_TEST_LOG_DIR"
          node --test tests/setup/demo-online.test.ts 2>&1 | tee "$IDX_TEST_LOG_DIR/demo-online.log"
      - name: Prove both deploy commands with Wrangler dry runs and no service secrets
        run: node --test tests/setup/demo-deploy.test.mjs 2>&1 | tee "$IDX_TEST_LOG_DIR/demo-deploy-command.log"
      - name: Prove database acceptance and command entry points
        id: acceptance
        run: |
          mkdir -p "$IDX_TEST_LOG_DIR"
          npm test 2>&1 | tee "$IDX_TEST_LOG_DIR/unit.log"
          npm run demo:db:migrate
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f packages/engine/setup/listing-writer.sql
          npm run demo:seed
      - name: Prove incremental feed recovery against a loopback stand-in
        run: node --test tests/sync/incremental.test.ts 2>&1 | tee "$IDX_TEST_LOG_DIR/incremental-sync.log"
      - name: Prove full feed repair against a loopback stand-in
        run: node --test tests/sync/full-scan.test.ts 2>&1 | tee "$IDX_TEST_LOG_DIR/full-scan.log"
      - name: Pack client and print release notes
        id: client-package
        run: |
          version=$(node -p 'require("./packages/client/package.json").version')
          tag="client-v$version"
          release_dir="$RUNNER_TEMP/client-release"
          mkdir -p "$release_dir"
          npm pack --workspace @idx-kit/client --pack-destination "$release_dir"
          tarball="$release_dir/idx-kit-client-$version.tgz"
          cp "docs/releases/$tag.md" "$release_dir/notes.md"
          cat "$release_dir/notes.md"
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Install the packed client outside the workspace and call the engine
        env:
          IDX_CLIENT_TARBALL: ${{ steps.client-package.outputs.tarball }}
        run: node --test tests/api/client-install.test.ts
      - name: Save the tested tarball and release notes for publication
        id: client-release-artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'IDX-Kit/idx-kit'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: client-release-${{ github.run_attempt }}
          path: ${{ runner.temp }}/client-release/
          if-no-files-found: error
      - name: Build server-rendered demo and install its pinned browser
        run: |
          npm run demo:site:build
          npx playwright install --with-deps chromium
      - name: Prove guide, search, property pages and inquiry receipts without JavaScript
        run: npm run test:demo 2>&1 | tee "$IDX_TEST_LOG_DIR/demo.log"
      - name: Prove search, detail, durable inquiry races, restarts and key lifecycle against the contract
        run: npm run test:api 2>&1 | tee "$IDX_TEST_LOG_DIR/api.log"
      - name: Prove inquiry email and failure isolation with a loopback stand-in
        run: node --test tests/api/inquiry-email.test.ts 2>&1 | tee "$IDX_TEST_LOG_DIR/inquiry-email.log"
      - name: Prove inquiry spam checks and replays with a loopback stand-in
        run: node --test tests/api/inquiry-spam.test.ts 2>&1 | tee "$IDX_TEST_LOG_DIR/inquiry-spam.log"
      - name: Prove reverse API order and measure filtered search plans at 100,000 listings
        run: |
          started=$SECONDS
          node --test tests/api/detail.test.ts 2>&1 | tee "$IDX_TEST_LOG_DIR/api-reverse-detail.log"
          IDX_TEST_SEARCH_VOLUME=1 node --test tests/api/search.test.ts 2>&1 | tee "$IDX_TEST_LOG_DIR/api-reverse-search.log"
          elapsed=$((SECONDS - started))
          echo "Reverse-order API proof added ${elapsed}s (budget: 60s)"
          (( elapsed < 60 ))
      - name: Build both Workers without deploying and enforce Free bundle size
        run: |
          npm run workers:site:build
          node scripts/check-worker-config.mjs examples/demo-site/dist-worker/server/wrangler.json
          npx wrangler deploy --config packages/engine/wrangler.jsonc --dry-run --outdir "$RUNNER_TEMP/worker-engine"
          npx wrangler deploy --config examples/demo-site/dist-worker/server/wrangler.json --dry-run --outdir "$RUNNER_TEMP/worker-site"
          node scripts/check-worker-size.mjs "$RUNNER_TEMP/worker-engine" "$RUNNER_TEMP/worker-site"
      - name: Run the API, key lifecycle and contract suites against the engine Worker
        env:
          IDX_RUNTIME: worker
        run: npm run test:api 2>&1 | tee "$IDX_TEST_LOG_DIR/worker-api.log"
      - name: Run the same no-JS site journeys through the Worker service binding
        env:
          IDX_RUNTIME: worker
        run: npm run test:demo 2>&1 | tee "$IDX_TEST_LOG_DIR/worker-demo.log"
      - name: Prove Worker database permissions, failure logs, inquiry email and spam checks
        env:
          IDX_RUNTIME: worker
        run: node --test tests/workers/database.test.ts 2>&1 | tee "$IDX_TEST_LOG_DIR/worker-database.log"
      - name: Prove safe database failure with the cluster stopped by CI
        run: |
          /usr/lib/postgresql/18/bin/pg_ctl -D "$RUNNER_TEMP/idx11-pg" -m fast -w stop
          node --input-type=module <<'JS'
          import assert from "node:assert/strict";
          import { startEngine } from "./tests/api/runtime.ts";
          import { validateResponse } from "./tests/api/contract.ts";
          const engine = await startEngine();
          let body;
          try {
            const response = await fetch("http://127.0.0.1:8787/api/v1/listings/lst_demo_0001", {
              headers: { Authorization: "Bearer invalid-secret-marker" },
            });
            const text = await response.text();
            body = JSON.parse(text);
            assert.equal(response.status, 503);
            assert.equal(body.code, "service_unavailable");
            assert.equal(body.requestId, response.headers.get("Request-Id"));
            validateResponse("/api/v1/listings/{listingId}", response, body);
            for (const value of ["postgres", "SELECT", "secret_hash", "ECONNREFUSED", "127.0.0.1", "idx_runtime"])
              assert.ok(!text.includes(value));
            for (const path of ["/api", "/api/v1/openapi.json"]) {
              const discovery = await fetch(`http://127.0.0.1:8787${path}`);
              assert.equal(discovery.status, 200);
              validateResponse(path, discovery, await discovery.json());
            }
          } finally {
            await engine.stop();
          }
          const failure = engine.logs().trim().split("\n")
            .map((line) => JSON.parse(line))
            .filter((line) => line.requestId === body.requestId);
          assert.equal(failure.length, 1);
          assert.equal(failure[0].operation, "key.lookup");
          assert.equal(failure[0].errorCode, "ECONNREFUSED");
          assert.equal(typeof failure[0].errorType, "string");
          console.log("Stopped database: safe 503, correlated cause, discovery and contract PASS.");
          JS
      - name: Reject credentials in every captured engine and site log
        id: logcheck
        if: always() && steps.online.outcome != 'skipped'
        run: node scripts/check-logs.mjs
      - name: Save verified runtime logs
        if: always() && steps.logcheck.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: runtime-logs
          path: /tmp/idx-test-logs/*.log
      - name: Stop only the task cluster
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/idx11-pg/postmaster.pid" ]; then
            /usr/lib/postgresql/18/bin/pg_ctl -D "$RUNNER_TEMP/idx11-pg" -m fast -w stop
          fi
  release-client:
    needs: [check, clean-demo]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'IDX-Kit/idx-kit'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    concurrency:
      group: ${{ needs.check.outputs.client_tag }}
      queue: max
    steps:
      - name: Check whether the client release is published with its tarball
        id: lookup
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.check.outputs.client_tag }}
        run: |
          asset="idx-kit-client-${TAG#client-v}.tgz"
          if lookup=$(gh release view "$TAG" --repo IDX-Kit/idx-kit --json isDraft,assets 2>&1); then
            if jq -e '.isDraft' <<< "$lookup" > /dev/null; then
              echo "Release $TAG is a draft. This run tested $GITHUB_SHA. Delete the draft release, then rerun this job." >&2
              exit 1
            fi
            if ! jq -e --arg asset "$asset" 'any(.assets[]; .name == $asset and .state == "uploaded" and .size > 0)' <<< "$lookup" > /dev/null; then
              echo "Release $TAG is missing $asset. This run tested $GITHUB_SHA. Restore the tarball using README.md#client-release-recovery." >&2
              exit 1
            fi
            echo "Release $TAG is published with $asset. This run tested $GITHUB_SHA."
            exit 0
          fi
          if [[ "$lookup" != 'release not found' ]]; then
            printf 'Could not check release %s. This run tested %s. Resolve the error below, then rerun this job.\n%s\n' "$TAG" "$GITHUB_SHA" "$lookup" >&2
            exit 1
          fi
          echo 'missing=true' >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        if: steps.lookup.outputs.missing == 'true'
        with:
          artifact-ids: ${{ needs.check.outputs.client_artifact }}
          path: ${{ runner.temp }}/client-release
      - name: Publish the client pre-release
        if: steps.lookup.outputs.missing == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.check.outputs.client_tag }}
        run: |
          ref="refs/tags/$TAG"
          tag_commit=$(git ls-remote --tags "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" "$ref" "$ref^{}" |
            awk -v ref="$ref" '
              $2 == ref { tag = $1 }
              $2 == ref "^{}" { commit = $1 }
              END { print (commit ? commit : tag) }
            ')
          if [[ -n "$tag_commit" && "$tag_commit" != "$GITHUB_SHA" ]]; then
            echo "Tag $TAG points to $tag_commit. This run tested $GITHUB_SHA. Publish a new client version using README.md#client-release-recovery." >&2
            exit 1
          fi
          release_dir="$RUNNER_TEMP/client-release"
          gh release create "$TAG" "$release_dir/idx-kit-client-${TAG#client-v}.tgz" \
            --repo IDX-Kit/idx-kit --target "$GITHUB_SHA" --title "$TAG" \
            --prerelease --notes-file "$release_dir/notes.md"
